<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="Header/Favicon.svg">
<title>Riverwalk — Pitch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&family=Inter:wght@400&display=swap" rel="stylesheet">
<style>
/* ============================================================
   Riverwalk — Pitch — Figma node 73:2863 (1920 / 1280 content)
   ============================================================ */
:root{--ink:#07071D;--paper:#FBF7EF;}
*{box-sizing:border-box;margin:0;padding:0}
html{overflow-x:hidden}
img{display:block;max-width:100%}
body{background:var(--ink);font-family:'Bricolage Grotesque',system-ui,sans-serif;color:#fff;-webkit-font-smoothing:antialiased;overflow-x:hidden;}
a{color:inherit;text-decoration:none}
.wrap{max-width:1280px;margin:0 auto;padding:0 clamp(20px,4vw,40px)}
.wrap-wide{max-width:1600px;margin:0 auto;padding:0 clamp(20px,4vw,40px)}

/* HEADER (cream) */
header{height:108px;background:var(--paper);}
.hd{height:108px;display:flex;align-items:center;justify-content:space-between;}
.logo{width:189.878px;height:37.56px;flex:0 0 auto;}
.logo img{width:100%;height:100%;object-fit:contain}
.hd-contact{font-weight:600;font-size:16px;line-height:28px;color:#000;text-align:right;}

/* HERO */
.rw-hero{position:relative;text-align:center;padding-top:86px;}
.hero-back{position:absolute;top:40px;left:clamp(20px,5.2vw,100px);width:48px;height:48px;z-index:5;display:block;}
.hero-back img{width:100%;height:100%;display:block;}
.rw-title{font-family:'Bricolage Grotesque';font-weight:700;font-size:clamp(40px,6.35vw,122px);line-height:normal;color:#C7C7C7;white-space:nowrap;}
.rw-sub{font-family:'Inter',sans-serif;font-weight:400;font-size:clamp(17px,1.7vw,24px);line-height:normal;color:#EAE9E9;max-width:1101px;margin:44px auto 0;}

/* SECTION LABELS + IMAGES */
.rw-label{font-family:'Bricolage Grotesque';font-weight:500;font-size:clamp(24px,2.5vw,32px);color:#fff;text-align:center;}
.rw-img{max-width:989px;margin:40px auto 0;}
.rw-img img{width:100%;height:auto;display:block;}
.intro-label{margin-top:96px;}
.home-label{margin-top:120px;}

/* FOOTER */
.foot{margin-top:120px;padding-bottom:33px;}
.foot-line{height:1px;background:rgba(255,255,255,.5);width:100%;}
.foot-contact{min-height:100px;padding:24px 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-family:'Bricolage Grotesque';font-weight:600;font-size:clamp(16px,2.2vw,24px);line-height:1.3;color:#fff;text-align:center;}

@media(max-width:640px){.hd-contact{font-size:clamp(11px,2.4vw,16px)}.rw-title{white-space:normal}}
@media(min-width:641px){.foot-contact{flex-flow:row wrap;gap:0;font-size:clamp(16px,1.8vw,22px);}.foot-contact span{white-space:nowrap;}.foot-contact span:nth-child(2)::before{content:"\2192";margin:0 10px;}.foot-contact span:nth-child(3)::before{content:"|";margin:0 10px;font-weight:400;}}
</style>
</head>
<body>

<header>
  <div class="wrap-wide hd">
    <a class="logo" href="index.html"><img src="Header/Designfolio%20Logo.svg" alt="DesignFolio"></a>
  </div>
</header>

<!-- HERO -->
<section class="wrap rw-hero">
  <a class="hero-back" href="index.html" aria-label="Back to home"><img src="Header/back%20arrow.svg" alt="Back"></a>
  <h1 class="rw-title">Riverwalk - Pitch</h1>
  <p class="rw-sub">Riverwalk is venture capital fund, sponsored by multi-billion dollar Thakral Group<br>I have designed the website keeping the theme of partnership.</p>
</section>

<!-- INTRODUCTION -->
<div class="wrap">
  <div class="rw-label intro-label">Introduction</div>
  <div class="rw-img"><img src="Riverwalk/riverwalk%20image%201.webp" alt="Riverwalk pitch — introduction"></div>
</div>

<!-- HOMEPAGE -->
<div class="wrap">
  <div class="rw-label home-label">Homepage</div>
  <div class="rw-img"><img src="Riverwalk/riverwalk%20image%202.webp" alt="Riverwalk pitch — homepage"></div>
</div>

<!-- FOOTER -->
<div class="wrap foot">
  <div class="foot-line"></div>
  <div class="foot-contact"><span>Contact</span><span>dhaval.design07@gmail.com</span><span>+91 95611 16517</span></div>
</div>

</body>
</html>
